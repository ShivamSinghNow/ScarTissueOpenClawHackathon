[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scartissue"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "anthropic>=0.50.0",
    "chromadb>=0.6.0",
    "voyageai>=0.3.0",
    "sentence-transformers>=3.3.0",
    "httpx>=0.27.0",
    "gitpython>=3.1.40",
    "PyGithub>=2.3.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.10.0",
    "rich>=13.0",
    "typer>=0.12",
    "unidiff>=0.7.5",
    "mcp>=1.0",
]

[project.scripts]
scartissue-mcp = "mcp_server.server:main"

[tool.hatch.build.targets.wheel]
packages = ["app", "mcp_server"]